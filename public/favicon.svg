<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="fp-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="fp-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="18" fill="url(#fp-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="url(#fp-emerald)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Subtle ambient inner glow -->
  <circle cx="32" cy="20" r="24" fill="url(#fp-glow)" filter="blur(8px)" />

  <!-- Calculator / Receipt Body -->
  <rect x="15" y="13" width="34" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Calculator Digital Display / Top Screen -->
  <rect x="20" y="18" width="24" height="8" rx="3" fill="#090d16" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
  <!-- Display Digits Bar -->
  <rect x="33" y="21" width="8" height="2" rx="1" fill="#34d399" />
  <rect x="23" y="21" width="3" height="2" rx="0.75" fill="#10b981" fill-opacity="0.6" />

  <!-- Grid Buttons -->
  <rect x="20" y="30" width="5.5" height="4.5" rx="1.5" fill="#334155" />
  <rect x="28" y="30" width="5.5" height="4.5" rx="1.5" fill="#334155" />
  <rect x="36" y="30" width="8" height="4.5" rx="1.5" fill="#334155" />

  <rect x="20" y="37" width="5.5" height="4.5" rx="1.5" fill="#334155" />
  <rect x="28" y="37" width="5.5" height="4.5" rx="1.5" fill="#334155" />
  
  <!-- Key Accent: Equals / Total Button in Vibrant Emerald -->
  <rect x="36" y="37" width="8" height="9.5" rx="2" fill="url(#fp-emerald)" />
  <!-- Equals Sign inside the Emerald Accent Button -->
  <line x1="38" y1="40.5" x2="42" y2="40.5" stroke="#042f2c" stroke-width="1.2" stroke-linecap="round" />
  <line x1="38" y1="43" x2="42" y2="43" stroke="#042f2c" stroke-width="1.2" stroke-linecap="round" />

  <!-- Bottom Left Zero Key -->
  <rect x="20" y="44" width="13.5" height="4" rx="1.5" fill="#334155" />
</svg>
